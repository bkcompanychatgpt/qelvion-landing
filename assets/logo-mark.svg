<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="QELVION Biotech mark">
  <defs>
    <linearGradient id="qg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55E6FF"/>
      <stop offset=".55" stop-color="#38D9F0"/>
      <stop offset="1" stop-color="#1FD6A4"/>
    </linearGradient>
    <radialGradient id="qcore" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B7F6FF"/>
      <stop offset=".7" stop-color="#38D9F0"/>
      <stop offset="1" stop-color="#1FD6A4"/>
    </radialGradient>
    <filter id="qblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- soft halo behind emblem -->
  <circle cx="100" cy="100" r="92" fill="url(#qg)" opacity=".10" filter="url(#qblur)"/>

  <!-- hexagon: molecule ring, gradient stroke -->
  <path d="M100 22 L164.6 61 L164.6 139 L100 178 L35.4 139 L35.4 61 Z"
        fill="none" stroke="#0E2B3C" stroke-width="10" stroke-linejoin="round"/>
  <path d="M100 22 L164.6 61 L164.6 139 L100 178 L35.4 139 L35.4 61 Z"
        fill="none" stroke="url(#qg)" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/>

  <!-- peptide helix ribbons -->
  <path d="M100 54 C 66 76, 66 124, 100 146" fill="none" stroke="#DDF8FF" stroke-width="3.6" stroke-linecap="round" opacity=".9"/>
  <path d="M100 54 C 134 76, 134 124, 100 146" fill="none" stroke="url(#qg)" stroke-width="6.2" stroke-linecap="round"/>
  <path d="M100 54 C 134 76, 134 124, 100 146" fill="none" stroke="#EAFDFF" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>

  <!-- Q-tail: signal strand peeling from the ring -->
  <path d="M164.6 130 C 186 128, 194 148, 180 168" fill="none" stroke="url(#qg)" stroke-width="6" stroke-linecap="round"/>

  <!-- nodes -->
  <circle cx="100" cy="100" r="10.5" fill="url(#qcore)"/>
  <circle cx="100" cy="100" r="4" fill="#04121A"/>
  <circle cx="180" cy="168" r="5.5" fill="url(#qg)"/>
  <circle cx="100" cy="54" r="3.4" fill="#DDF8FF"/>
  <circle cx="100" cy="146" r="3.4" fill="#DDF8FF"/>
</svg>
